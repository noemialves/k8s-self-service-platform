apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: k8s-self-service-platform:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /environment
              port: 8080
          livenessProbe:
            httpGet:
              path: /environment
              port: 8080
